# Example configuration of firmline-agent for a Debian device that updates one application with a
# script. Copy to /etc/firmline/agent.conf and replace the values with those of your Firmline
# account (platform address, broker address and the update key of the «OTA releases» page).
# The agent refuses a key it does not know and a value it cannot use, with the line number.

[platform]
url = https://platform.example.com
broker = broker.example.com
# The public key that signed the releases, PEM, copied from the «OTA releases» page.
update_key = /etc/firmline/update.pem
# The serial number is read from a file written at the end-of-line test station.
serial = file:/etc/acme/serial
# What the agent runs after a script that exited 10 (installed at the next boot).
reboot_command = /usr/bin/systemctl reboot

[component app]
main = true
# The installed version is what the install script writes in this file.
version = file:/opt/acme/VERSION
install = script:/usr/lib/firmline/install.sh
timeout = 300

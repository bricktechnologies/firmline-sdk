# Example configuration of firmline-agent for a Toradex module with Torizon OS, where the agent
# is a service of the customer's Docker Compose application (see examples/torizon/docker-compose.yml
# and the "Torizon" section of docs/integration.md). It is mounted into the container at
# /etc/firmline, from a folder of the Torizon image. Replace the values with those of your
# Firmline account. The agent refuses a key it does not know and a value it cannot use, with the
# line number.

[platform]
url = https://platform.example.com
broker = broker.example.com
# The public key that signed the releases, PEM, copied from the «OTA releases» page.
update_key = /etc/firmline/update.pem
# The serial number of the module: the host file /sys/firmware/devicetree/base/serial-number, which
# the composition mounts at this path (the container cannot read /sys/firmware itself).
serial = file:/run/firmline/serial-number
# The host's /etc/os-release, mounted by the composition (the container has its own).
os_release = /host/os-release

# Torizon OS: reported in the status, never installed by the agent (Torizon updates the system).
[component torizon-os]
version = os-release:VERSION_ID
install = none

# The application: the services of the composition, updated with a package made by `pack`.
# The version is 1.0.0 until the first package is installed, then the version of the last one.
[component application]
main = true
version = package:1.0.0
install = docker-compose
# The defaults, written for clarity: the composition that Torizon starts at every boot, its
# project and the service of the agent in it.
compose_file = /var/sota/storage/docker-compose/docker-compose.yml
project = torizon
agent_service = firmline-agent
# Seconds the new composition is watched after an update (10 to 3600).
health_timeout = 120

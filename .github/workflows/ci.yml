name: CI

on:
  pull_request:
  push:
    branches: [main]

# Actions are pinned to commit SHAs (tag in the comment), the same as in release.yml.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check.sh

  test-arm64:
    # Unit tests only, emulated: run only when the repository is public (private minutes are limited).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - run: |
          docker build -q -t firmline-dev --platform linux/arm64 -f docker/dev.Dockerfile docker
          docker run --rm --platform linux/arm64 -v "$PWD:/work" firmline-dev bash -c '
            set -euo pipefail
            cmake -S . -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFIRMLINE_BUILD_AGENT=OFF
            cmake --build build-arm64 -j2
            ctest --test-dir build-arm64 --output-on-failure'
